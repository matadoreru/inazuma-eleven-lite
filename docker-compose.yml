services:
  app-prod:
    image: ghcr.io/matadoreru/inazuma-eleven-lite:latest
    container_name: inazuma-prod
    restart: unless-stopped
    ports:
      - "80:80"

  app-pre:
    image: ghcr.io/matadoreru/inazuma-eleven-lite:dev
    container_name: inazuma-pre
    restart: unless-stopped
    ports:
      - "8080:80"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - DOCKER_CONFIG=/config.json
    command: --interval 300
